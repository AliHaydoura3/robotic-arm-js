<!DOCTYPE html>
<html>
<head>
  <title>Servo Control</title>
</head>
<body>

<h1>Servo Controller</h1>

<input
  type="range"
  min="0"
  max="180"
  value="90"
  id="slider"
/>

<h2 id="angle">90</h2>

<script>

const socket =
  new WebSocket("wss://robotic-arm-ws-a7adg0debudta0bp.italynorth-01.azurewebsites.net");

const slider =
  document.getElementById("slider");

const angle =
  document.getElementById("angle");

const throttleInterval = 100;
let lastSendTime = 0;

slider.addEventListener("input", () => {

    angle.innerText = slider.value;

    const now = Date.now();
    if (now - lastSendTime >= throttleInterval && socket.readyState === WebSocket.OPEN) {
        socket.send(slider.value);
        lastSendTime = now;
    }
});

</script>

</body>
</html>
